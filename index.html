<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/style.css">
  <title>Login</title>
</head>
<body>
  <form class="container" id="loginForm">
    <h1 class="titulo">Login</h1>
    
    <label for="email">Digite seu email:</label>
    <input type="email" id="email" placeholder="Ex: abc123@email.com" required><br><br>
    
    <label for="senha">Digite sua senha:</label>
    <input type="password" id="senha" placeholder="Ex: 12345" required><br><br>
    <button type="submit" class="botao-enviar">Entrar</button>
  </form>
  <script src="script.js"></script>
</body>
</html>
